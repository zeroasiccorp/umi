name: Testbench CI
on:
  # Runs on all PRs
  pull_request:
  # Manual Dispatch
  workflow_dispatch:

jobs:
  switchboard_ci:
    name: "Switchboard CI"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zeroasiccorp/sbtest:latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: pytest
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv venv
          . venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .[test]
          pytest -m "switchboard" -x --verbose --durations=0


  cocotb_ci:
    name: "Cocotb CI"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/siliconcompiler/sc_runner:latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: pytest
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv venv
          . venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .[test]
          pytest -m "cocotb" -x --verbose --durations=0


  python_ci:
    name: "Python + Tools CI"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/siliconcompiler/sc_tools:latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: pytest
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv venv
          . venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .[test]
          pytest -m "not switchboard and not cocotb and not formal" -n logical --verbose


  formal_ci:
    name: "Formal CI"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/siliconcompiler/sc_tools:latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # the sc_tools image ships yosys, sby, yosys-abc, boolector and
      # bitwuzla; the lane pins bitwuzla itself
      # rather than inheriting the sby task's default engine
      - name: pytest
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv venv
          . venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .[test]
          # a lane that skips entirely would otherwise report success
          # having verified nothing, so require rows to have actually run
          pytest -m "formal" --durations=0 | tee /tmp/formal.log
          grep -qE "[0-9]+ passed" /tmp/formal.log
